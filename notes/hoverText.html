<!DOCTYPE html>
<html>
<head> 
    <meta charset="utf-8"> 
    <title>HiHiHi</title> 
    
    <style>*
        {
        margin: 0;
        padding: 0;
        font-family: consolas;
        }
        #arrow {
            font-weight: bold;
            text-decoration: none;
            font-size: 50px;
            color: rgb(255, 255, 255);
            font-family: 'Courier New';
            margin-top:-5%;
            margin-left: -5%;
            margin-bottom: 10%;
            
        }
        #arrow:hover {
            color:  rgb(159, 159, 159);
        }
        body
        {display:flex;
            justify-content: center;
            align-items:center; 
            min-height: 100vh;  /* min height to 100% of the viewport height. */
            background: #000;
        }
        
        .loader 
        {
            position:relative;
        }
        
        .loader span 
        {
            position: relative;
            font-size: 2em;
            color:#ccff00;
            display: inline-block; 
            text-transform: uppercase;
        
            animation: animate 1s ease-in-out infinite;   
            animation-delay: calc(0.1s * var(--i));  /* deplay animation based on -i. */
            animation-play-state: paused;  /* initally pauses the animation */
        
        }
        
        .loader:hover span
        {
            animation-play-state: running;  /* when hovering run the animation */
        }
        
        @keyframes animate
        {
            0%,40%,100%
            {
                transform: translateY(0);  /* no vertical translation (transform in Y-axis)*/
            }
            
            20%
            {
                transform: translateY(-50px);  /*20%Translates span upward (negative Y-axis)*/
            }
        
        }
        
        </style>
</head> 



<body> 
    <a href="excercise.html" id="arrow">&larr;</a>
    <div class="loader"> 
        <span style="--i:1;">H</span> 
        <span style="--i:2;">i</span>
        <span style="--i:3;">H</span>
        <span style="--i:4;">i</span>
        <span style="--i:5;">H</span>
        <span style="--i:6;">i</span>
        <span style="--i:7;">H</span>
        <span style="--i:8;">i</span>
        <span style="--i:9;"> </span>
        <span style="--i:10;">W</span>
        <span style="--i:11;">o</span>
        <span style="--i:12;">r</span>
        <span style="--i:13;">l</span>
        <span style="--i:14;">d</span>
        <span style="--i:15;">!</span>

    </div> 
</body> 
</html>
